  <rect width="64" height="64" rx="15" fill="#0D0E10"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#D4FF3A" stroke-opacity=".28" stroke-width="2"/>
  <g class="sp"><path fill="#D4FF3A" d="M32 12c1.6 11.2 5.8 15.4 17 17-11.2 1.6-15.4 5.8-17 17-1.6-11.2-5.8-15.4-17-17 11.2-1.6 15.4-5.8 17-17Z" transform="translate(0 3)"/></g>
  <g class="dot"><circle cx="32" cy="10" r="4" fill="#fff"/></g>
</svg>
